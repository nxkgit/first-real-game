# Checks every pull request, and pushes to the unattended-work branches (auto/** and integration/**).
# Other branches are covered when their PR opens, so a PR branch is not checked twice; main is
# covered by the deploy workflow, which runs the same checks before publishing.
name: CI

on:
  pull_request:
  push:
    branches: ['auto/**', 'integration/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
