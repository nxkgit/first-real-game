# Builds the game and publishes it to GitHub Pages on every push to main, so there's
# always a shareable link (https://<owner>.github.io/first-real-game/) for playtesting.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Same typecheck + tests as `npm run verify`; only the build step differs (the --base below).
      - run: npx tsc
      - run: npm test
      # Pages serves the site under /<repo-name>/, so asset URLs need that base path.
      # Passed here rather than in a Vite config so local dev and Docker still serve from /.
      # VITE_REPORT_SECRET is the shared key the in-game Report button sends to the report proxy
      # (QA_PLAN.md). Add it once under repo Settings -> Secrets and variables -> Actions as
      # REPORT_SECRET. It ends up in the built page, so it only stops casual abuse.
      - run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          VITE_REPORT_SECRET: ${{ secrets.REPORT_SECRET }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
