<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deckbuilder MVP</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f0f15;
        overflow: hidden;
      }
      #app {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        /* the game handles every touch itself: no scrolling, pinch-zoom, text selection, or long-press menu */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* The 800x600 layout is unreadably small on a phone held upright, so ask for landscape. */
      #rotate-hint {
        display: none;
      }
      @media (orientation: portrait) and (max-width: 600px) {
        #rotate-hint {
          display: flex;
          position: fixed;
          inset: 0;
          align-items: center;
          justify-content: center;
          padding: 24px;
          text-align: center;
          background: #0f0f15;
          color: #c8c8d8;
          font: 18px/1.5 monospace;
          z-index: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate-hint">Turn your phone sideways to play.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
